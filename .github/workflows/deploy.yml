name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare nginx config
        id: nginx
        env:
          NGINX_CONF: ${{ secrets.NGINX_CONF }}
        run: |
          {
            echo 'b64<<EOF'
            printf '%s' "$NGINX_CONF" | base64
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NGINX_CONF_B64: ${{ steps.nginx.outputs.b64 }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          envs: GH_TOKEN,NGINX_CONF_B64
          script_stop: true
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            APP_DIR="${{ secrets.DO_APP_DIR }}"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --branch main "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            command -v pm2 >/dev/null 2>&1 || npm i -g pm2
            pm2 delete test-deployment >/dev/null 2>&1 || true
            pm2 start npm --name test-deployment --cwd "$APP_DIR" -- start
            pm2 save
            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            fi
            printf '%s' "$NGINX_CONF_B64" | base64 -d > /etc/nginx/sites-available/test-deployment
            ln -sfn /etc/nginx/sites-available/test-deployment /etc/nginx/sites-enabled/test-deployment
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl reload nginx
